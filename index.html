<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario de Matemáticas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            background: white;
            padding: 20px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fafafa;
        }
        .question-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .options-list {
            list-style: none;
            padding: 0;
        }
        .options-list li {
            margin-bottom: 8px;
        }
        label {
            cursor: pointer;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #219150;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            display: none;
        }
        .correct {
            background-color: #d4edda;
            color: #155724;
        }
        .incorrect {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cuestionario de Matemáticas</h1>
    <form id="quizForm"></form>
    <button type="button" onclick="evaluar()">Enviar Respuestas</button>
    <div id="result"></div>
</div>

<script>
const cuestionario = [
  // Sección: Indica si es Igualdad o Ecuación
  {
    pregunta: "Indica si '6 + 7 = 13' es una Igualdad o una Ecuación:",
    opciones: ["Igualdad", "Ecuación"],
    respuestaCorrecta: "Igualdad"
  },
  {
    pregunta: "Indica si 'x + 5 = 12' es una Igualdad o una Ecuación:",
    opciones: ["Igualdad", "Ecuación"],
    respuestaCorrecta: "Ecuación"
  },
  {
    pregunta: "Indica si '4 × 8 = 32' es una Igualdad o una Ecuación:",
    opciones: ["Igualdad", "Ecuación"],
    respuestaCorrecta: "Igualdad"
  },
  {
    pregunta: "Indica si '24 - x = 10' es una Igualdad o una Ecuación:",
    opciones: ["Igualdad", "Ecuación"],
    respuestaCorrecta: "Ecuación"
  },

  // Sección: Completa para formar igualdades
  {
    pregunta: "Completa el espacio en blanco: 8 - 5 = ____",
    opciones: ["3", "2", "4", "5"],
    respuestaCorrecta: "3"
  },
  {
    pregunta: "Completa el espacio en blanco: ____ - 6 = 10",
    opciones: ["16", "4", "14", "60"],
    respuestaCorrecta: "16"
  },
  {
    pregunta: "Completa el espacio en blanco: 7 × ____ = 35",
    opciones: ["5", "6", "4", "7"],
    respuestaCorrecta: "5"
  },
  {
    pregunta: "Completa el espacio en blanco: 24 ÷ ____ = 6",
    opciones: ["4", "3", "6", "8"],
    respuestaCorrecta: "4"
  },

  // Sección: Resuelve las ecuaciones
  {
    pregunta: "Resuelve la ecuación: x + 8 = 20",
    opciones: ["x = 12", "x = 28", "x = 10", "x = 14"],
    respuestaCorrecta: "x = 12"
  },
  {
    pregunta: "Resuelve la ecuación: x - 9 = 15",
    opciones: ["x = 24", "x = 6", "x = 22", "x = 135"],
    respuestaCorrecta: "x = 24"
  },
  {
    pregunta: "Resuelve la ecuación: 25 - x = 12",
    opciones: ["x = 13", "x = 37", "x = 12", "x = 15"],
    respuestaCorrecta: "x = 13"
  },
  {
    pregunta: "Resuelve la ecuación: 6 × x = 42",
    opciones: ["x = 7", "x = 8", "x = 36", "x = 252"],
    respuestaCorrecta: "x = 7"
  },
  {
    pregunta: "Resuelve la ecuación: x - 5 = 9",
    opciones: ["x = 14", "x = 4", "x = 45", "x = 15"],
    respuestaCorrecta: "x = 14"
  },
  {
    pregunta: "Resuelve la ecuación: x + 14 = 30",
    opciones: ["x = 16", "x = 44", "x = 14", "x = 20"],
    respuestaCorrecta: "x = 16"
  },
  {
    pregunta: "Resuelve la ecuación: 8 × y = 56",
    opciones: ["y = 7", "y = 6", "y = 8", "y = 48"],
    respuestaCorrecta: "y = 7"
  },
  {
    pregunta: "Resuelve la ecuación: h × 4 = 12",
    opciones: ["h = 3", "h = 8", "h = 16", "h = 48"],
    respuestaCorrecta: "h = 3"
  },

  // Sección: Resuelve los problemas
  {
    pregunta: "Lucía tenía cierta cantidad de colores. Su mamá le regaló 8 colores y ahora tiene 21. ¿Cuántos colores tenía inicialmente?",
    opciones: ["13 colores", "29 colores", "15 colores", "12 colores"],
    respuestaCorrecta: "13 colores"
  },
  {
    pregunta: "En una caja había cierta cantidad de naranjas. Se utilizaron 12 y quedaron 18. ¿Cuántas naranjas había al principio?",
    opciones: ["30 naranjas", "6 naranjas", "24 naranjas", "36 naranjas"],
    respuestaCorrecta: "30 naranjas"
  },
  {
    pregunta: "Cuatro bolsas contienen la misma cantidad de panes. En total hay 28 panes. ¿Cuántos panes contiene cada bolsa?",
    opciones: ["7 panes", "6 panes", "8 panes", "112 panes"],
    respuestaCorrecta: "7 panes"
  },
  {
    pregunta: "Lucía tenía cierta cantidad de figuritas. Su amiga le regaló 12 y ahora tiene 30. ¿Cuántas figuritas tenía al principio?",
    opciones: ["18 figuritas", "42 figuritas", "22 figuritas", "15 figuritas"],
    respuestaCorrecta: "18 figuritas"
  }
];

// Mezclar preguntas aleatoriamente (Algoritmo Fisher-Yates)
function mezclarArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

const preguntasDesordenadas = mezclarArray([...cuestionario]);

// Renderizar preguntas en el formulario
const formContainer = document.getElementById('quizForm');

preguntasDesordenadas.forEach((q, index) => {
  const card = document.createElement('div');
  card.className = 'card';

  const title = document.createElement('div');
  title.className = 'question-title';
  title.textContent = `${index + 1}. ${q.pregunta}`;
  card.appendChild(title);

  const list = document.createElement('ul');
  list.className = 'options-list';

  q.opciones.forEach((opcion) => {
    const li = document.createElement('li');
    li.innerHTML = `
      <label>
        <input type="radio" name="p${index}" value="${opcion}">
        ${opcion}
      </label>
    `;
    list.appendChild(li);
  });

  card.appendChild(list);
  formContainer.appendChild(card);
});

// Función para evaluar el cuestionario
function evaluar() {
  let puntaje = 0;
  
  preguntasDesordenadas.forEach((q, index) => {
    const seleccion = document.querySelector(`input[name="p${index}"]:checked`);
    if (seleccion && seleccion.value === q.respuestaCorrecta) {
      puntaje++;
    }
  });

  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'block';
  resultDiv.className = puntaje === preguntasDesordenadas.length ? 'correct' : 'incorrect';
  resultDiv.textContent = `Obtuviste ${puntaje} de ${preguntasDesordenadas.length} respuestas correctas.`;
}
</script>

</body>
</html>
